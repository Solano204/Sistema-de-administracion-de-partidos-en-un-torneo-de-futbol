name: Backend PR checks

# There was no test/build gate on the actual Spring Boot backend before this
# pass - openapi-lint only ever checks the generated OpenAPI spec, never ran
# `mvn test`. Compiles and runs unit tests across the full 9-module reactor.

on:
  pull_request:
    paths:
      - "backend/soccer-system (2)/soccer-system/soccer-system/**"
      - ".github/workflows/backend-pr.yml"

permissions:
  contents: read

concurrency:
  group: backend-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_DIR: "backend/soccer-system (2)/soccer-system/soccer-system"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: soccerdb
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: 1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d soccerdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Seed schema from database/init scripts
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client
          for f in "$BACKEND_DIR"/database/init/*.sql; do
            echo "Applying $f"
            PGPASSWORD=1234 psql -h localhost -U admin -d soccerdb -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Build and test (full reactor)
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/soccerdb
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: 1234
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
          # Dev-only test key, same default already committed in application.yaml / .env - not a real secret.
          APP_SECURITY_JWT_SECRET_KEY: dGVzdF9zZWNyZXRfa2V5X2Zvcl9kZXZlbG9wbWVudF9vbmx5X2RvX25vdF91c2VfaW5fcHJvZHVjdGlvbg==
        run: mvn -B test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-surefire-reports
          path: "${{ env.BACKEND_DIR }}/**/target/surefire-reports/*.xml"
          retention-days: 7
          if-no-files-found: ignore
